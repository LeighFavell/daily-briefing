name: Build briefing

on:
  schedule:
    - cron: "7 * * * *"   # hourly; the job only builds when a briefing time is due
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [build-now, fetch-only, normal]
        default: build-now

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job/requirements.txt
      - run: pip install -r job/requirements.txt
      - name: Run briefing job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            build-now)  python job/briefing.py --force ;;
            fetch-only) python job/briefing.py --fetch-only ;;
            *)          python job/briefing.py ;;
          esac
